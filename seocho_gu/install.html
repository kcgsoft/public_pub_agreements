<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서리풀버스 설치</title>
  <meta name="description" content="서리풀버스 앱 설치 안내입니다. iPhone은 App Store, Android는 Google Play에서 설치할 수 있습니다.">
  <style>
    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: system-ui, sans-serif;
    }

    main {
      max-width: 420px;
      margin: 0 auto;
      padding: 40px 24px 48px;
    }

    .lockup {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .lockup img {
      width: 74px;
      height: auto;
      flex: none;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 34px;
      line-height: 1.2;
      letter-spacing: -0.05em;
    }

    .lead {
      margin: 0 0 32px;
      font-size: 16px;
      line-height: 1.6;
    }

    .stores {
      display: grid;
      gap: 10px;
    }

    .stores a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 24px;
      padding: 14px 16px;
      border: 1px solid #111;
      border-radius: 14px;
      color: inherit;
      font-weight: 600;
      text-decoration: none;
    }

    .stores a:focus-visible {
      outline: 2px solid #111;
      outline-offset: 3px;
    }

    .stores svg {
      width: 22px;
      height: 22px;
      flex: none;
    }

    .availability {
      margin: 16px 0 0;
      color: #555;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <div class="lockup">
      <img src="logo.png" alt="" width="498" height="341">
      <span>서리풀버스</span>
    </div>
    <h1>앱 설치 안내</h1>
    <p class="lead">서초구청이 운영하는 순환 셔틀버스입니다.</p>
    <div class="stores">
      <a href="https://apps.apple.com/kr/app/id6822164703">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M16.4 1.4c0 1.1-.5 2.3-1.2 3.1-.7.9-2 1.6-3 1.6-.1 0-.2 0-.3 0 0-.1 0-.2 0-.4 0-1.1.6-2.3 1.2-3 .8-.9 2.1-1.6 3.2-1.7.1.1.1.3.1.4zm4.6 15.7c0 .1-.5 1.6-1.5 3.1-1 1.3-1.9 2.7-3.4 2.7-1.5 0-1.9-.9-3.6-.9-1.7 0-2.3.9-3.7.9-1.4 0-2.3-1.3-3.4-2.8-1.3-1.8-2.3-4.6-2.3-7.3 0-4.3 2.8-6.5 5.6-6.5 1.4 0 2.7 1 3.6 1 .9 0 2.2-1 3.9-1 .6 0 2.9.1 4.4 2.2-.1.1-2.5 1.5-2.5 4.4 0 3.5 3.1 4.7 3.1 4.7-.1.1-.4 1.4-1.2 2.5z" />
        </svg>
        App Store로 이동
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.spacosa.android.catchloc.seocho&amp;hl=ko&amp;gl=KR">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#34A853" d="M3.6 20.4 13.1 12 3.6 3.6c-.4.4-.6.9-.6 1.6v13.6c0 .7.2 1.2.6 1.6z" />
          <path fill="#FBBC04" d="M16.4 15.2 13.1 12 3.6 20.4c.5.5 1.2.6 2 .1l10.8-5.3z" />
          <path fill="#4285F4" d="M20.5 10.8 16.4 8.5 13.1 12l3.3 3.2 4.1-2.4c.9-.5.9-1.5 0-2z" />
          <path fill="#EA4335" d="M3.6 3.6 13.1 12l3.3-3.5L5.6 2.5c-.8-.5-1.5-.4-2 .1 0 .3 0 .7 0 1z" />
        </svg>
        Google Play로 이동
      </a>
    </div>
    <p class="availability">앱은 각 스토어에서 공개된 뒤 설치할 수 있습니다.</p>
  </main>
</body>
</html>
