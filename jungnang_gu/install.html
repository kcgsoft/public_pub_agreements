<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>중랑동행버스 설치</title>
  <link href="https://cdn.jsdelivr.net/npm/@sun-typeface/suit@2.0.5/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <style>
    :root {
      --black: #000000;
      --white: #FFFFFF;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--black);
      font-family: "SUIT Variable", sans-serif;
      background: var(--white);
    }

    main {
      max-width: 420px;
      margin: 0 auto;
      padding: 40px 24px 48px;
    }

    .lockup {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 0 0 36px;
    }

    .mark {
      display: block;
      width: 72px;
      height: auto;
      flex: none;
    }

    h1 {
      margin: 0;
      font-family: "SUIT Variable", sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.25;
    }

    .notice {
      margin: 0 0 12px;
      font-size: 36px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.05em;
    }

    .lead {
      margin: 0 0 36px;
      font-size: 16px;
      line-height: 1.6;
    }

    .stores {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    a,
    button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      box-sizing: border-box;
      padding: 16px 16px;
      border: 0;
      border-radius: 14px;
      text-decoration: none;
      font: 500 16px "SUIT Variable", sans-serif;
    }

    #ios,
    #android,
    #outside {
      background: var(--white);
      color: var(--black);
      box-shadow: inset 0 0 0 1px var(--black);
    }

    #ios svg path {
      fill: var(--black);
    }

    a svg {
      width: 22px;
      height: 22px;
      flex: none;
    }

    button[hidden] {
      display: none;
    }

    .stops {
      margin-top: 48px;
    }

    .stops h2 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 700;
    }

    #map {
      height: 320px;
      margin: 0 0 8px;
      border: 1px solid #000;
    }

    .stops p {
      margin: 0 0 16px;
      font-size: 13px;
      line-height: 1.5;
    }

    #stop-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #stop-list button {
      display: block;
      width: 100%;
      margin: 0 0 8px;
      padding: 12px 0;
      border: 0;
      border-bottom: 1px solid #000;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: #000;
      text-align: left;
      font: 500 15px "SUIT Variable", sans-serif;
    }

    #stop-list .where {
      display: block;
      margin-top: 4px;
      font-weight: 400;
      font-size: 13px;
    }

    .pin span {
      display: flex;
      width: 22px;
      height: 22px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #000;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }

    .notice,
    .mark,
    h1,
    .lead,
    .stores {
      animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .mark { animation-delay: 0.05s; }
    h1 { animation-delay: 0.1s; }
    .notice { animation-delay: 0.16s; }
    .lead { animation-delay: 0.22s; }
    .stores { animation-delay: 0.28s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .notice, .mark, h1, .lead, .stores { animation: none; }
    }
  </style>
</head>

<body>
  <main>
    <div class="lockup">
      <img class="mark" src="logo.png" alt="">
      <h1>중랑동행버스</h1>
    </div>
    <p class="notice">곧 출시 예정입니다.</p>
    <p class="lead">중랑구청이 운영하는 순환 셔틀버스입니다.</p>
    <div class="stores">
      <a id="ios"><svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#111"
            d="M16.4 1.4c0 1.1-.5 2.3-1.2 3.1-.7.9-2 1.6-3 1.6-.1 0-.2 0-.3 0 0-.1 0-.2 0-.4 0-1.1.6-2.3 1.2-3 .8-.9 2.1-1.6 3.2-1.7.1.1.1.3.1.4zm4.6 15.7c0 .1-.5 1.6-1.5 3.1-1 1.3-1.9 2.7-3.4 2.7-1.5 0-1.9-.9-3.6-.9-1.7 0-2.3.9-3.7.9-1.4 0-2.3-1.3-3.4-2.8-1.3-1.8-2.3-4.6-2.3-7.3 0-4.3 2.8-6.5 5.6-6.5 1.4 0 2.7 1 3.6 1 .9 0 2.2-1 3.9-1 .6 0 2.9.1 4.4 2.2-.1.1-2.5 1.5-2.5 4.4 0 3.5 3.1 4.7 3.1 4.7-.1.1-.4 1.4-1.2 2.5z" />
        </svg>App Store로 이동</a>
      <a id="android"><svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#34A853" d="M3.6 20.4 13.1 12 3.6 3.6c-.4.4-.6.9-.6 1.6v13.6c0 .7.2 1.2.6 1.6z" />
          <path fill="#FBBC04" d="M16.4 15.2 13.1 12 3.6 20.4c.5.5 1.2.6 2 .1l10.8-5.3z" />
          <path fill="#4285F4" d="M20.5 10.8 16.4 8.5 13.1 12l3.3 3.2 4.1-2.4c.9-.5.9-1.5 0-2z" />
          <path fill="#EA4335" d="M3.6 3.6 13.1 12l3.3-3.5L5.6 2.5c-.8-.5-1.5-.4-2 .1 0 .3 0 .7 0 1z" />
        </svg>Play Store로 이동</a>
      <button id="outside" hidden type="button">브라우저에서 열기</button>
    </div>
    <section class="stops" aria-labelledby="stops-title">
      <h2 id="stops-title">정류장</h2>
      <div id="map"></div>
      <p>번호가 있는 점만 지도에 있습니다. 붙임 자료만 있는 정류장은 목록에 있습니다.</p>
      <ol id="stop-list"></ol>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const OPEN_STORE = false;
    const IOS_APP_ID = "0000000000";
    const ANDROID_ID = "com.spacosa.android.catchloc.jungnang";
    const ua = navigator.userAgent;
    const kakao = /KAKAOTALK/i.test(ua);

    function storeHref() {
      return {
        ios: "itms-" + "apps://apps.apple.com/app/id" + IOS_APP_ID,
        android: "mar" + "ket://details?id=" + ANDROID_ID,
      };
    }

    function webHref() {
      return {
        ios: "https://apps.apple.com/kr/app/id" + IOS_APP_ID,
        android: "https://play.google.com/store/apps/details?id=" + ANDROID_ID,
      };
    }

    // Kakao's in-app webview hangs if this page points at a store scheme on load.
    const links = kakao ? webHref() : storeHref();
    document.getElementById("ios").href = links.ios;
    document.getElementById("android").href = links.android;

    function storeUrlFor(userAgent, maxTouchPoints) {
      const stores = storeHref();
      if (/Android/i.test(userAgent)) return stores.android;
      if (/iPhone|iPad|iPod/.test(userAgent)) return stores.ios;
      // Macintosh, not Mac, because an iPhone user-agent contains "Mac OS X".
      if (/Macintosh/.test(userAgent) && maxTouchPoints > 0) return stores.ios;
      return null;
    }

    if (OPEN_STORE && !kakao) {
      const url = storeUrlFor(ua, navigator.maxTouchPoints || 0);
      if (url) setTimeout(function () { location.replace(url); }, 500);
    }

    if (kakao) {
      const outside = document.getElementById("outside");
      outside.hidden = false;
      outside.addEventListener("click", function () {
        const page = location.href;
        if (/iPhone|iPad|iPod/.test(ua)) {
          location.href = "kakao" + "talk://web/openExternal?url=" + encodeURIComponent(page);
          return;
        }
        const rest = page.replace(/^https?:\/\//i, "");
        location.href = "intent" + "://" + rest + "#Intent;scheme=https;action=android.intent.action.VIEW;S.browser_fallback_url=" + encodeURIComponent(page) + ";end";
      });
    }

    const STOPS = [
      { n: 1, name: "중랑구청", where: "기점, 종점", lat: 37.60661, lng: 127.09423 },
      { n: 2, name: "대한노인회중랑구지회", where: "쌍용아파트.신내테크노타운앞" },
      { n: 3, name: "중화1동주민센터", where: "중화역2번출구.중화1동주민센터", lat: 37.6016358, lng: 127.0807314 },
      { n: 4, name: "중화2동주민센터", where: "중화역입구", lat: 37.6018053, lng: 127.0777831 },
      { n: 5, name: "묵2동주민센터", where: "금보당금은방", lat: 37.6079004, lng: 127.0766217 },
      { n: 6, name: "중랑구실내놀이터(묵동장미마을점)", where: "붙임파일 참고" },
      { n: 7, name: "중화2동체육공원", where: "중화2동체육공원", lat: 37.6003145, lng: 127.0738453 },
      { n: 8, name: "중화어린이도서관", where: "중랑세무서", lat: 37.593835, lng: 127.0724871 },
      { n: 9, name: "중랑세무서", where: "서울우유앞", lat: 37.5917572, lng: 127.0729237 },
      { n: 10, name: "딩가동4번지", where: "동부시장남문입구", lat: 37.5904165, lng: 127.0774563 },
      { n: 11, name: "상봉2동주민센터", where: "88병원", lat: 37.5913813, lng: 127.0807262 },
      { n: 12, name: "중랑문화원", where: "중랑구시설관리공단" },
      { n: 13, name: "딩가동2번지", where: "면목마젤란아파트" },
      { n: 14, name: "중랑구보훈회관", where: "면목두산1차.사가정아이파크", lat: 37.5817989, lng: 127.0835911 },
      { n: 15, name: "제2방정환교육지원센터", where: "사가정역3번출구", lat: 37.5806789, lng: 127.0872965 },
      { n: 16, name: "중랑구가족센터", where: "중화중학교.면목고등학교", lat: 37.58398, lng: 127.094 },
      { n: 17, name: "망우3동주민센터", where: "망우3동주민센터.혜원여중고후문", lat: 37.592151, lng: 127.0933107 },
      { n: 18, name: "중랑실내놀이터(망우역점)", where: "상봉터미널", lat: 37.5962146, lng: 127.0928693 },
      { n: 19, name: "방정환교육지원센터", where: "중랑구방정환교육지원센터", lat: 37.5974176, lng: 127.0887727 },
      { n: 20, name: "유린원광장애인복지관", where: "성원아파트.경남아너스빌앞", lat: 37.6034629, lng: 127.0958366 }
    ];

    const map = L.map("map", { scrollWheelZoom: false });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);
    const list = document.getElementById("stop-list");
    const bounds = [];
    STOPS.forEach(function (stop) {
      const item = document.createElement("li");
      const button = document.createElement("button");
      button.type = "button";
      button.innerHTML = stop.n + ". " + stop.name + "<span class=\"where\">" + stop.where + "</span>";
      item.appendChild(button);
      list.appendChild(item);
      if (stop.lat == null) return;
      const marker = L.marker([stop.lat, stop.lng], {
        icon: L.divIcon({
          className: "pin",
          html: "<span>" + stop.n + "</span>",
          iconSize: [22, 22],
          iconAnchor: [11, 11]
        })
      }).addTo(map);
      marker.bindPopup(stop.n + ". " + stop.name);
      bounds.push([stop.lat, stop.lng]);
      button.addEventListener("click", function () {
        map.flyTo([stop.lat, stop.lng], 16);
        marker.openPopup();
      });
    });
    if (bounds.length) map.fitBounds(bounds, { padding: [24, 24] });
  </script>
</body>

</html>
