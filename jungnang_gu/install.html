<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>중랑동행버스 설치</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #143024;
      --green: #1C7C38;
      --sun: #F28D00;
      --paper: #F6F1E6;
      --card: #FFFDF8;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "IBM Plex Sans KR", sans-serif;
      background:
        radial-gradient(circle at 88% 8%, #FFD9A0 0 92px, transparent 93px),
        radial-gradient(circle at 88% 8%, rgba(242, 141, 0, 0.35) 0 140px, transparent 141px),
        linear-gradient(#F6F1E6, #F6F1E6);
    }

    body::after {
      content: "";
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 84px;
      background:
        radial-gradient(80px 40px at 12% 100%, #1C7C38 98%, transparent 100%),
        radial-gradient(120px 48px at 38% 110%, #176832 98%, transparent 100%),
        radial-gradient(160px 56px at 72% 115%, #1C7C38 98%, transparent 100%);
      pointer-events: none;
    }

    main {
      position: relative;
      max-width: 420px;
      margin: 0 auto;
      padding: 28px 22px 120px;
    }

    .notice {
      margin: 0 0 28px;
      padding: 14px 16px;
      background: var(--ink);
      color: #F6F1E6;
      font-size: 16px;
      letter-spacing: -0.02em;
    }

    .mark {
      display: block;
      width: 84px;
      height: auto;
      margin: 0 0 18px;
      filter: drop-shadow(0 10px 16px rgba(20, 48, 36, 0.12));
    }

    h1 {
      margin: 0 0 10px;
      font-family: "Gowun Batang", serif;
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.15;
    }

    .lead {
      margin: 0 0 22px;
      font-size: 16px;
      line-height: 1.6;
    }

    .facts {
      margin: 0 0 28px;
      padding: 0;
      list-style: none;
    }

    .facts li {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 10px;
      font-size: 15px;
    }

    .facts li::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sun);
      flex: none;
    }

    .stores {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    a,
    button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      box-sizing: border-box;
      padding: 16px 16px;
      border: 0;
      border-radius: 14px;
      text-decoration: none;
      font: 500 16px "IBM Plex Sans KR", sans-serif;
    }

    #ios {
      background: var(--ink);
      color: #F6F1E6;
    }

    #ios svg path {
      fill: #F6F1E6;
    }

    #android,
    #outside {
      background: var(--card);
      color: var(--ink);
      box-shadow: inset 0 0 0 1.5px var(--green);
    }

    a svg {
      width: 22px;
      height: 22px;
      flex: none;
    }

    button[hidden] {
      display: none;
    }

    .notice,
    .mark,
    h1,
    .lead,
    .facts,
    .stores {
      animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .mark { animation-delay: 0.05s; }
    h1 { animation-delay: 0.1s; }
    .lead { animation-delay: 0.16s; }
    .facts { animation-delay: 0.22s; }
    .stores { animation-delay: 0.28s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .notice, .mark, h1, .lead, .facts, .stores { animation: none; }
    }
  </style>
</head>

<body>
  <main>
    <p class="notice">곧 출시 예정입니다.</p>
    <img class="mark" src="logo.png" alt="중랑동행버스">
    <h1>중랑동행버스</h1>
    <p class="lead">중랑구청이 운영하는 순환 셔틀버스입니다.</p>
    <ul class="facts">
      <li>실시간 차량 위치</li>
      <li>정류장과 노선 안내</li>
      <li>운행 시간표</li>
    </ul>
    <div class="stores">
      <a id="ios"><svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#111"
            d="M16.4 1.4c0 1.1-.5 2.3-1.2 3.1-.7.9-2 1.6-3 1.6-.1 0-.2 0-.3 0 0-.1 0-.2 0-.4 0-1.1.6-2.3 1.2-3 .8-.9 2.1-1.6 3.2-1.7.1.1.1.3.1.4zm4.6 15.7c0 .1-.5 1.6-1.5 3.1-1 1.3-1.9 2.7-3.4 2.7-1.5 0-1.9-.9-3.6-.9-1.7 0-2.3.9-3.7.9-1.4 0-2.3-1.3-3.4-2.8-1.3-1.8-2.3-4.6-2.3-7.3 0-4.3 2.8-6.5 5.6-6.5 1.4 0 2.7 1 3.6 1 .9 0 2.2-1 3.9-1 .6 0 2.9.1 4.4 2.2-.1.1-2.5 1.5-2.5 4.4 0 3.5 3.1 4.7 3.1 4.7-.1.1-.4 1.4-1.2 2.5z" />
        </svg>App Store로 이동</a>
      <a id="android"><svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#34A853" d="M3.6 20.4 13.1 12 3.6 3.6c-.4.4-.6.9-.6 1.6v13.6c0 .7.2 1.2.6 1.6z" />
          <path fill="#FBBC04" d="M16.4 15.2 13.1 12 3.6 20.4c.5.5 1.2.6 2 .1l10.8-5.3z" />
          <path fill="#4285F4" d="M20.5 10.8 16.4 8.5 13.1 12l3.3 3.2 4.1-2.4c.9-.5.9-1.5 0-2z" />
          <path fill="#EA4335" d="M3.6 3.6 13.1 12l3.3-3.5L5.6 2.5c-.8-.5-1.5-.4-2 .1 0 .3 0 .7 0 1z" />
        </svg>Play Store로 이동</a>
      <button id="outside" hidden type="button">브라우저에서 열기</button>
    </div>
  </main>
  <script>
    const OPEN_STORE = false;
    const IOS_APP_ID = "0000000000";
    const ANDROID_ID = "com.spacosa.android.catchloc.jungnang";
    const ua = navigator.userAgent;
    const kakao = /KAKAOTALK/i.test(ua);

    function storeHref() {
      return {
        ios: "itms-" + "apps://apps.apple.com/app/id" + IOS_APP_ID,
        android: "mar" + "ket://details?id=" + ANDROID_ID,
      };
    }

    function webHref() {
      return {
        ios: "https://apps.apple.com/kr/app/id" + IOS_APP_ID,
        android: "https://play.google.com/store/apps/details?id=" + ANDROID_ID,
      };
    }

    // Kakao's in-app webview hangs if this page points at a store scheme on load.
    const links = kakao ? webHref() : storeHref();
    document.getElementById("ios").href = links.ios;
    document.getElementById("android").href = links.android;

    function storeUrlFor(userAgent, maxTouchPoints) {
      const stores = storeHref();
      if (/Android/i.test(userAgent)) return stores.android;
      if (/iPhone|iPad|iPod/.test(userAgent)) return stores.ios;
      // Macintosh, not Mac, because an iPhone user-agent contains "Mac OS X".
      if (/Macintosh/.test(userAgent) && maxTouchPoints > 0) return stores.ios;
      return null;
    }

    if (OPEN_STORE && !kakao) {
      const url = storeUrlFor(ua, navigator.maxTouchPoints || 0);
      if (url) setTimeout(function () { location.replace(url); }, 500);
    }

    if (kakao) {
      const outside = document.getElementById("outside");
      outside.hidden = false;
      outside.addEventListener("click", function () {
        const page = location.href;
        if (/iPhone|iPad|iPod/.test(ua)) {
          location.href = "kakao" + "talk://web/openExternal?url=" + encodeURIComponent(page);
          return;
        }
        const rest = page.replace(/^https?:\/\//i, "");
        location.href = "intent" + "://" + rest + "#Intent;scheme=https;action=android.intent.action.VIEW;S.browser_fallback_url=" + encodeURIComponent(page) + ";end";
      });
    }
  </script>
</body>

</html>
