<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중랑동행버스 설치</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; color: #111; }
  main { max-width: 420px; padding: 28px 20px; }
  img { display: block; width: 72px; height: auto; margin: 0 0 16px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 12px; line-height: 1.5; font-size: 15px; }
  ul { margin: 0 0 24px; padding-left: 18px; line-height: 1.6; font-size: 15px; }
  .stores { display: flex; flex-direction: column; gap: 10px; }
  a { display: block; padding: 14px 16px; border: 1px solid #1C7C38; text-align: center; color: #1C7C38; text-decoration: none; font-size: 16px; }
</style>
</head>
<body>
<main>
<img src="logo.png" alt="중랑동행버스">
<h1>중랑동행버스</h1>
<p>중랑구청이 운영하는 순환 셔틀버스입니다.</p>
<ul>
  <li>실시간 차량 위치</li>
  <li>정류장과 노선 안내</li>
  <li>운행 시간표</li>
</ul>
<div class="stores">
  <a id="ios">App Store로 이동</a>
  <a id="android">Play Store로 이동</a>
</div>
</main>
<script>
const STORE_URL = {
  ios: "itms-apps://apps.apple.com/app/id0000000000",
  android: "market://details?id=com.spacosa.android.catchloc.jungnang",
};

document.getElementById("ios").href = STORE_URL.ios;
document.getElementById("android").href = STORE_URL.android;
</script>
</body>
</html>
